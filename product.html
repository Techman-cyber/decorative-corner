<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Decorative Corner</title>
<link rel="stylesheet" href="style.css">
<style>
.product-topbar{max-width:1100px;margin:24px auto 0;padding:0 20px}.back-arrow{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--navy,#17233d);font-weight:700;font-size:15px}.back-arrow span{font-size:25px;line-height:1}.product-page{max-width:1100px;margin:18px auto 50px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.gallery{position:relative;overflow:hidden;background:#f7f3ed;border-radius:18px}.gallery{cursor:crosshair}.gallery img{width:100%;display:block;cursor:zoom-in;transition:transform .08s linear;transform-origin:var(--mx,50%) var(--my,50%)}.gallery.zoomed img{transform:scale(5)}.hint{font-size:12px;text-align:center;color:#777;padding:8px}.stars{color:#b8923f;font-size:24px;letter-spacing:2px}.rating-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.rating-summary small{color:#777;font-size:13px;letter-spacing:0}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.benefit{background:#f7f3ed;border:1px solid #eadfce;border-radius:12px;padding:13px 10px;font-size:12px;font-weight:700;text-align:center;color:#493d30}.product-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.product-actions .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px}.view-cart{display:none}.review{border-top:1px solid #ddd;padding:15px 0}.review-form{display:grid;gap:10px}.review-form textarea{padding:12px;border:1px solid #ccc;border-radius:8px;min-height:110px}.review-form button{padding:12px;background:#222;color:white;border:0;border-radius:8px;cursor:pointer}.star-picker{display:flex;gap:4px;margin:4px 0 8px}.star-choice{border:0;background:transparent;color:#c9c9c9;font-size:34px;line-height:1;cursor:pointer;padding:0 2px}.star-choice.selected,.star-choice:hover{color:#b8923f}.selected-rating{font-size:13px;color:#777;margin:0}.empty{color:#777;padding:20px 0}.reviewer{font-weight:700}.review-date{font-size:12px;color:#888;margin-left:8px}@media(max-width:700px){.product-page{grid-template-columns:1fr;margin:10px auto 30px}.benefits{grid-template-columns:1fr}.product-topbar{margin-top:15px}}
</style>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png"><link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
</head>
<body>
<div class="product-topbar"><a class="back-arrow" href="index.html#shop"><span>←</span> Back to shop</a></div>
<main class="product-page">
<section><div class="gallery" id="gallery"><img id="product-image" src="images/product-pink.png" alt="Product"><div class="hint">Move your cursor over the image for ultra zoom</div></div></section>
<section>
<p class="eyebrow">Decorative Corner</p><h1 id="product-name">Blush Ring</h1><h2 id="product-price">₹125</h2>
<div id="rating-summary" class="rating-summary"><span class="stars">☆☆☆☆☆</span><small>(0 ratings)</small></div>
<p id="product-description">Handmade beaded hanging.</p>
<label>Quantity <input id="qty" type="number" min="1" value="1"></label>
<div class="product-actions"><button class="btn btn-primary" id="add">Add to cart</button><a class="btn btn-outline view-cart" id="view-cart" href="cart.html">View in cart →</a></div>
<div class="benefits"><div class="benefit">✦ 100% Handmade</div><div class="benefit">✦ Made with Care</div><div class="benefit">✦ Unique Designs</div></div>
<hr><h2>Customer reviews</h2><div id="reviews" class="empty">No reviews yet.</div>
<h3>Write a review</h3><form class="review-form" id="review-form">
<div><div class="star-picker" id="star-picker" aria-label="Choose a rating"><button type="button" class="star-choice" data-rating="1" aria-label="1 star">★</button><button type="button" class="star-choice" data-rating="2" aria-label="2 stars">★</button><button type="button" class="star-choice" data-rating="3" aria-label="3 stars">★</button><button type="button" class="star-choice" data-rating="4" aria-label="4 stars">★</button><button type="button" class="star-choice" data-rating="5" aria-label="5 stars">★</button></div><p class="selected-rating" id="selected-rating">Choose 1–5 stars</p></div>
<textarea id="review-text" placeholder="Write a review (optional)"></textarea><button>Submit review</button><p id="status"></p></form>
</section></main><script type="module" src="product.js"></script></body></html>
