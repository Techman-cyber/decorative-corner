<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Decorative Corner</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="wrap"><a class="brand" href="index.html"><img class="logo-mark" src="images/logo.png"><span class="brand-name">Decorative<br>Corner</span></a><div class="header-actions"><button class="icon-btn" data-cart-button>Cart (0)</button><a class="btn btn-outline" href="index.html#shop">Back to shop</a></div></div></header><main class="wrap product-page" id="product-root"></main><script src="script.js"></script><script>const p=getProducts().find(x=>x.id===new URLSearchParams(location.search).get('id'))||getProducts()[0];document.title=p.name+' — Decorative Corner';document.getElementById('product-root').innerHTML=`<div class="product-detail"><div class="product-gallery"><img id="main-product-image" src="${p.image}" alt="${p.name}"><div class="zoom-hint">Click image to zoom</div></div><div class="product-buy"><p class="eyebrow">${p.tag}</p><h1>${p.name}</h1><div class="rating">★★★★★ <b>${p.rating}</b> <span>(customer reviews)</span></div><div class="detail-price">₹${p.price.toLocaleString('en-IN')}</div><p>${p.description}</p><ul>${p.details.map(x=>'<li>'+x+'</li>').join('')}</ul><div class="quantity"><label>Quantity <input id="qty" type="number" min="1" value="1"></label></div><button class="btn btn-primary" id="add">Add to cart</button><button class="btn btn-gold" id="buy">Buy now</button><p class="small-note">Secure checkout • Handmade with care • Easy cart management</p></div></div><section class="reviews"><h2>Ratings & reviews</h2><div class="review-summary"><strong>${p.rating}/5</strong><span>★★★★★</span><p>Beautiful handmade finish. Product reviews will appear here as customers share feedback.</p></div></section>`;document.getElementById('add').onclick=()=>{addProduct(p.id,+document.getElementById('qty').value||1);location.href='cart.html'};document.getElementById('buy').onclick=()=>{addProduct(p.id,+document.getElementById('qty').value||1);location.href='cart.html'};document.getElementById('main-product-image').onclick=e=>e.currentTarget.classList.toggle('zoomed');updateCartCount();</script></body></html>
