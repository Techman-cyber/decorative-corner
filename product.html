<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Decorative Corner</title><link rel="stylesheet" href="style.css"><style>
.product-page{max-width:1100px;margin:50px auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.gallery{position:relative;overflow:hidden;background:#f7f3ed;border-radius:18px}.gallery{cursor:crosshair}.gallery img{width:100%;display:block;cursor:zoom-in;transition:transform .08s linear;transform-origin:var(--mx,50%) var(--my,50%)}.gallery.zoomed img{transform:scale(5)}.hint{font-size:12px;text-align:center;color:#777;padding:8px}.stars{color:#b8923f;font-size:24px;letter-spacing:2px}.review{border-top:1px solid #ddd;padding:15px 0}.review-form{display:grid;gap:10px}.review-form input,.review-form textarea,.review-form select{padding:12px;border:1px solid #ccc;border-radius:8px}.review-form button{padding:12px;background:#222;color:white;border:0;border-radius:8px}.empty{color:#777;padding:20px 0}@media(max-width:700px){.product-page{grid-template-columns:1fr;margin:20px auto}}
</style><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
</head><body><main class="product-page"><section><div class="gallery" id="gallery"><img id="product-image" src="images/product-pink.png" alt="Product"><div class="hint">Move your cursor over the image for ultra zoom</div></div></section><section><p class="eyebrow">Decorative Corner</p><h1 id="product-name">Blush Ring</h1><h2 id="product-price">$00</h2><div id="rating-summary" class="stars">☆☆☆☆☆ <small>(0 ratings)</small></div><p id="product-description">Handmade beaded hanging.</p><label>Quantity <input id="qty" type="number" min="1" value="1"></label><br><button class="btn btn-primary" id="add">Add to cart</button><a class="btn btn-outline" href="cart.html">View cart</a><a class="btn btn-outline" href="index.html#shop">Back to shop</a><hr><h2>Customer reviews</h2><div id="reviews" class="empty">No reviews yet.</div><h3>Write a review</h3><form class="review-form" id="review-form"><input id="review-name" placeholder="Your name" required><select id="review-rating" required><option value="">Choose rating</option><option value="1">★ 1</option><option value="2">★★ 2</option><option value="3">★★★ 3</option><option value="4">★★★★ 4</option><option value="5">★★★★★ 5</option></select><textarea id="review-text" placeholder="Your review" required></textarea><button>Submit review</button><p id="status"></p></form></section></main><script type="module" src="product.js"></script></body></html>
