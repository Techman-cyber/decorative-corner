<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Decorative Corner</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.ico"><style>
.checkout{max-width:1120px;margin:34px auto;padding:0 20px}.checkout-back{display:inline-block;margin-bottom:12px;color:var(--ink)}.checkout h1{font-family:var(--font-display);font-size:clamp(34px,5vw,54px);color:var(--navy);margin:12px 0 8px}.checkout-intro{color:var(--muted);margin:0 0 26px}.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.checkout-card{background:#fffdf9;border:1px solid #e4d9cd;border-radius:20px;padding:28px;box-shadow:0 8px 24px rgba(45,34,24,.05)}.checkout-card h2{font-family:var(--font-display);color:var(--navy);font-size:30px;margin:0 0 24px}.field{margin-bottom:17px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #cfc2b5;border-radius:11px;background:#fff;padding:13px 14px;font:inherit;color:var(--ink)}.field textarea{min-height:105px;resize:vertical}.location-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.location-btn:hover{background:var(--navy);color:#fff}.notice{font-size:14px;line-height:1.5;color:var(--muted)}.summary-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #eadfd4}.summary-total{font-size:24px;font-weight:800;padding-top:18px}.payment-options{display:grid;gap:10px}.payment-options label{display:flex;align-items:center;gap:12px;border:1px solid #d9cbbd;border-radius:12px;padding:15px;cursor:pointer;background:#fff}.payment-options label:has(input:checked){border:2px solid var(--navy);background:#f7f1e9}.payment-options input{accent-color:var(--navy);width:18px;height:18px}.payment-extra{display:none;margin:16px 0;padding:16px;border-radius:12px;background:#f5eee6}.payment-extra.show{display:block}.checkout-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.checkout-actions button,.checkout-actions a{border:0;border-radius:11px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--navy);color:#fff}.secondary{background:#eee4da;color:var(--ink)}.status{font-weight:700;margin:16px 0 0}.empty-checkout{padding:34px;border:1px dashed #cfc2b5;border-radius:16px;background:#fffdf9}.empty-checkout .shop-first{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;padding:13px 18px;border-radius:10px;text-decoration:none;font-weight:800}@media(max-width:760px){.checkout{margin:20px auto;padding:0 14px}.checkout-grid{grid-template-columns:1fr}.checkout-card{padding:21px}.checkout-card h2{font-size:27px}}
</style></head><body><main class="checkout"><a class="checkout-back" href="cart.html">← Back to shopping bag</a><h1>Secure checkout</h1><p class="checkout-intro">Review your order, add delivery details, and choose how you want to pay.</p><div id="empty" class="empty-checkout" hidden></div><form id="checkout-form" class="checkout-grid" novalidate><section class="checkout-card"><h2>1. Delivery details</h2><div class="field"><label for="customerName">Full name</label><input id="customerName" name="customer_name" required autocomplete="name"></div><div class="field"><label for="customerEmail">Email</label><input id="customerEmail" name="customer_email" type="email" required autocomplete="email"></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div><div class="field"><label for="address">Complete delivery address</label><textarea id="address" name="address" required placeholder="House/flat, street, area, city, state, PIN"></textarea></div><button type="button" class="location-btn" id="location-btn">Use my current location</button><p id="location-status" class="notice" aria-live="polite"></p></section><section class="checkout-card"><h2>2. Order &amp; payment</h2><div id="summary"></div><div class="field"><label>Payment method</label><div class="payment-options"><label><input type="radio" name="payment_method" value="UPI" required> UPI</label><label><input type="radio" name="payment_method" value="QR code"> QR code</label><label><input type="radio" name="payment_method" value="Card"> Card</label><label><input type="radio" name="payment_method" value="Cash on delivery"> Cash on delivery</label></div></div><div id="online-extra" class="payment-extra"><strong>Payment proof</strong><p class="notice">Complete payment using your configured payment method, then provide the reference and screenshot.</p><div class="field"><label for="transactionId">Transaction ID / reference</label><input id="transactionId" name="transaction_id"></div><div class="field"><label for="proof">Payment screenshot</label><input id="proof" name="payment_proof" type="file" accept="image/*"></div></div><div class="field"><label for="notes">Order notes (optional)</label><textarea id="notes" name="order_notes" placeholder="Any delivery instructions..."></textarea></div><input type="hidden" id="orderDetails" name="order_details"><input type="hidden" id="totalAmount" name="total_amount"><input type="hidden" id="orderTime" name="order_time"><div class="checkout-actions"><button class="primary" type="submit">Confirm order</button><a class="secondary" href="cart.html">Back</a></div><p id="status" class="status" role="status" aria-live="polite"></p></section></form></main><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script src="script.js"></script><script>
const KEY='dc-cart',PRICE=125,cart=JSON.parse(localStorage.getItem(KEY)||'[]'),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),qty=x=>Math.max(1,Number(x.qty)||1),total=cart.reduce((s,x)=>s+PRICE*qty(x),0),form=document.getElementById('checkout-form');
if(!cart.length){form.hidden=true;const empty=document.getElementById('empty');empty.hidden=false;empty.innerHTML='<h2>Your bag is empty</h2><p class="notice">Add a product to your bag before checking out.</p><a class="shop-first" href="index.html#shop">Shop something first</a>'}else{document.getElementById('summary').innerHTML=cart.map(x=>`<div class="summary-row"><span>${x.name} × ${qty(x)}</span><strong>${money(PRICE*qty(x))}</strong></div>`).join('')+`<div class="summary-row summary-total"><span>Total</span><strong>${money(total)}</strong></div>`;document.getElementById('orderDetails').value=cart.map(x=>`${x.name} x ${qty(x)} = ${money(PRICE*qty(x))}`).join(' | ');document.getElementById('totalAmount').value=money(total)}
document.querySelectorAll('input[name="payment_method"]').forEach(r=>r.addEventListener('change',()=>document.getElementById('online-extra').classList.toggle('show',r.value==='UPI'||r.value==='QR code')));
document.getElementById('location-btn').addEventListener('click',()=>{const st=document.getElementById('location-status');if(!navigator.geolocation){st.textContent='Location is unavailable. Please enter your address below.';return}st.textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(p=>{const line=`GPS: ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;const a=document.getElementById('address');a.value=a.value.trim()?a.value.trim()+'\n'+line:line;st.textContent='Location added. Please complete your full address.'},()=>{st.textContent='Could not access location. Please enter your address manually.'})});
form.addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');if(!form.reportValidity())return;const submitButton=form.querySelector('button[type="submit"]');submitButton.disabled=true;const orderDate=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});document.getElementById('orderTime').value=orderDate;const orderDetails=cart.map(x=>`${x.name} x ${qty(x)}`).join(' | ');const customerNameValue=document.getElementById('customerName').value.trim(),customerEmailValue=document.getElementById('customerEmail').value.trim(),phoneValue=document.getElementById('phone').value.trim(),addressValue=document.getElementById('address').value.trim(),totalValue=money(total),quantityValue=cart.reduce((sum,x)=>sum+qty(x),0);const params={customer_name:customerNameValue,customer_email:customerEmailValue,customer_phone:phoneValue,delivery_address:addressValue,product_name:orderDetails,quantity:quantityValue,total_amount:totalValue,order_date:orderDate,order_details:orderDetails,order_time:orderDate,payment_method:form.elements.payment_method.value,transaction_id:document.getElementById('transactionId').value.trim(),order_notes:document.getElementById('notes').value.trim(),name:customerNameValue,email:customerEmailValue,phone:phoneValue,address:addressValue,product:orderDetails,amount:totalValue,total:totalValue,items:orderDetails};status.textContent='Sending order confirmation…';try{if(!window.emailjs)throw new Error('Email service unavailable');emailjs.init({publicKey:'a665ft42jkT4MzBUX'});const customerResult=await emailjs.send('service_s0utxfc','template_k4g6fau',params);const adminResult=await emailjs.send('service_s0utxfc','template_ygn7oqs',params);status.textContent='Order confirmed! Confirmation and store notification sent.';localStorage.removeItem(KEY);form.querySelectorAll('input,textarea,button,select').forEach(el=>{if(el.type!=='hidden')el.disabled=true})}catch(err){console.error(err);submitButton.disabled=false;status.textContent='Could not send the order automatically. Check the EmailJS template settings and try again.'}});
</script></body></html>
