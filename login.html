<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Decorative Corner</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* This page shows itself once we know whether someone is already logged in. */
  html.auth-checking body { visibility: hidden; }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a class="auth-brand" href="index.html">
      <img src="images/logo-header.png" alt="Decorative Corner logo">
      <span>Decorative Corner</span>
    </a>

    <h1 id="auth-heading">Welcome back</h1>
    <p class="auth-subtitle" id="auth-subtitle">Sign in to keep browsing.</p>

    <div class="auth-tabs" role="tablist" aria-label="Sign in or create account">
      <button class="auth-tab" id="tab-signin" type="button" role="tab" aria-selected="true">Sign in</button>
      <button class="auth-tab" id="tab-signup" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="email-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
      </div>

      <div class="auth-row-between">
        <button type="button" class="auth-link" id="forgot-password">Forgot password?</button>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="email-submit">Sign in</button>

      <p class="auth-status" id="auth-status" role="status"></p>
    </form>

    <div class="auth-divider">or</div>

    <button class="btn-google" type="button" id="google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-footer-note">By continuing you agree to be nice to our beads.</p>
  </div>
</div>

<script type="module">
  import { auth } from "./firebase-config.js";
  import {
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    sendPasswordResetEmail,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "index.html";

  // Already signed in? Skip straight to the site instead of showing the form.
  onAuthStateChanged(auth, (user) => {
    if (user) {
      location.replace(next);
    } else {
      document.documentElement.classList.remove("auth-checking");
    }
  });

  const tabSignin = document.getElementById("tab-signin");
  const tabSignup = document.getElementById("tab-signup");
  const heading = document.getElementById("auth-heading");
  const subtitle = document.getElementById("auth-subtitle");
  const submitBtn = document.getElementById("email-submit");
  const status = document.getElementById("auth-status");
  const form = document.getElementById("email-form");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const forgotBtn = document.getElementById("forgot-password");

  let mode = "signin";

  function setMode(newMode) {
    mode = newMode;
    const isSignin = mode === "signin";
    tabSignin.setAttribute("aria-selected", String(isSignin));
    tabSignup.setAttribute("aria-selected", String(!isSignin));
    heading.textContent = isSignin ? "Welcome back" : "Create your account";
    subtitle.textContent = isSignin ? "Sign in to keep browsing." : "Takes less than a minute.";
    submitBtn.textContent = isSignin ? "Sign in" : "Create account";
    passwordInput.autocomplete = isSignin ? "current-password" : "new-password";
    status.textContent = "";
    status.className = "auth-status";
  }

  tabSignin.addEventListener("click", () => setMode("signin"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  function showError(err) {
    status.className = "auth-status error";
    status.textContent = friendlyError(err);
  }

  function friendlyError(err) {
    const code = err && err.code;
    switch (code) {
      case "auth/invalid-email": return "That email address doesn't look right.";
      case "auth/user-not-found":
      case "auth/wrong-password":
      case "auth/invalid-credential": return "Email or password is incorrect.";
      case "auth/email-already-in-use": return "An account already exists with that email — try signing in instead.";
      case "auth/weak-password": return "Password should be at least 6 characters.";
      case "auth/popup-closed-by-user": return "Google sign-in was closed before finishing.";
      case "auth/network-request-failed": return "Network error — check your connection and try again.";
      default: return "Something went wrong. Please try again.";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "";
    status.className = "auth-status";
    submitBtn.disabled = true;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
      if (mode === "signin") {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      location.replace(next);
    } catch (err) {
      showError(err);
    } finally {
      submitBtn.disabled = false;
    }
  });

  forgotBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!email) {
      status.className = "auth-status error";
      status.textContent = "Enter your email above first, then tap \"Forgot password?\".";
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      status.className = "auth-status success";
      status.textContent = `Password reset email sent to ${email}.`;
    } catch (err) {
      showError(err);
    }
  });

  document.getElementById("google-signin").addEventListener("click", async () => {
    status.textContent = "";
    status.className = "auth-status";
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
      location.replace(next);
    } catch (err) {
      showError(err);
    }
  });
</script>
</body>
</html>
