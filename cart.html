<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Bag — Decorative Corner</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.ico"><style>.cart-qty{display:inline-flex;align-items:center;gap:10px;margin-top:8px}.cart-qty button{width:34px;height:34px;border:1px solid #d8cfc5;background:#fff;border-radius:8px;font-size:20px;cursor:pointer}.cart-qty output{min-width:22px;text-align:center;font-weight:700}.cart-row{display:flex;gap:18px;align-items:center;margin:18px 0;padding:16px;border:1px solid #e8dfd6;border-radius:14px}.cart-row img{width:88px;height:88px;object-fit:cover;border-radius:10px}.cart-row h3{margin:0 0 6px}.cart-row p{margin:0}.cart-remove{margin-top:10px;border:1px solid #c94b4b;background:#fff4f4;color:#a51d1d;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}.cart-remove:hover{background:#ffe3e3}.cart-total{font-size:20px;font-weight:800;margin:24px 0}</style></head><body><main class="cart-page"><a href="index.html">← Continue shopping</a><h1>Your shopping bag</h1><div id="items"></div><div id="total" class="cart-total"></div><p id="checkout-note"></p><a class="btn btn-primary" href="contact.html">Contact us to place your order</a></main><script>const KEY='dc-cart';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function put(c){localStorage.setItem(KEY,JSON.stringify(c));render()}function render(){const c=get(),el=document.getElementById('items');if(!c.length){el.innerHTML='<div class="empty">Your shopping bag is empty.</div>';document.getElementById('total').textContent='';return}el.innerHTML=c.map((x,i)=>`<div class="cart-row"><img src="${x.image}" alt="${x.name}"><div style="flex:1"><h3>${x.name}</h3><p>${money(125)}</p><div class="cart-qty" aria-label="Quantity for ${x.name}"><button type="button" data-minus="${i}" aria-label="Decrease quantity">−</button><output>${Math.max(1,Number(x.qty)||1)}</output><button type="button" data-plus="${i}" aria-label="Increase quantity">+</button></div><button type="button" class="cart-remove" data-remove="${i}">Remove</button></div></div>`).join('');document.getElementById('total').textContent='Total: '+money(c.reduce((s,x)=>s+125*(Math.max(1,Number(x.qty)||1)),0));document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.minus);c[i].qty=Math.max(1,(Number(c[i].qty)||1)-1);put(c)}));document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.plus);c[i].qty=(Number(c[i].qty)||1)+1;put(c)}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.remove);c.splice(i,1);put(c)}))}render();</script></body></html>
