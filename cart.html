<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart — Decorative Corner</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="wrap"><a class="brand" href="index.html"><img class="logo-mark" src="images/logo.png"><span class="brand-name">Decorative<br>Corner</span></a><a class="btn btn-outline" href="index.html#shop">Continue shopping</a></div></header><main class="wrap cart-page"><h1>Your cart</h1><div id="cart-root"></div></main><script src="script.js"></script><script>function renderCart(){const root=document.getElementById('cart-root'),c=getCart(),ps=getProducts();if(!c.length){root.innerHTML='<div class="empty-cart"><h2>Your cart is empty</h2><p>Add something beautiful to get started.</p><a class="btn btn-primary" href="index.html#shop">Explore products</a></div>';return}let total=0;root.innerHTML='<div class="cart-list">'+c.map(i=>{const p=ps.find(x=>x.id===i.id);total+=p.price*i.qty;return `<article class="cart-item"><img src="${p.image}" alt="${p.name}"><div><h2>${p.name}</h2><p>₹${p.price.toLocaleString('en-IN')}</p><label>Qty <input type="number" min="1" value="${i.qty}" data-qty="${i.id}"></label><button class="text-btn" data-remove="${i.id}">Remove</button></div><strong>₹${(p.price*i.qty).toLocaleString('en-IN')}</strong></article>`}).join('')+'</div><aside class="cart-summary"><h2>Order summary</h2><p>Subtotal <strong>₹'+total.toLocaleString('en-IN')+'</strong></p><p>Shipping <strong>Calculated at checkout</strong></p><hr><h2>Total <strong>₹'+total.toLocaleString('en-IN')+'</strong></h2><button class="btn btn-primary" id="checkout">Proceed to checkout</button><p class="small-note">Demo checkout: connect your payment gateway before launch.</p></aside>';root.querySelectorAll('[data-qty]').forEach(x=>x.onchange=()=>{const c=getCart(),i=c.find(i=>i.id===x.dataset.qty);i.qty=Math.max(1,+x.value||1);saveCart(c);renderCart()});root.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{saveCart(getCart().filter(i=>i.id!==x.dataset.remove));renderCart()});document.getElementById('checkout').onclick=()=>alert('Checkout is ready to connect to Razorpay/Stripe or your preferred payment gateway.');}renderCart();updateCartCount();</script></body></html>
