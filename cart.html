<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart — Decorative Corner</title><link rel="stylesheet" href="style.css"><style>.cart-page{max-width:900px;margin:50px auto;padding:20px}.cart-row{display:flex;gap:18px;align-items:center;border-bottom:1px solid #ddd;padding:18px 0}.cart-row img{width:90px;height:90px;object-fit:cover;border-radius:12px}.cart-row input{width:65px;padding:8px}.cart-total{font-size:22px;font-weight:700;text-align:right;margin:25px 0}.empty{text-align:center;padding:50px;color:#777}</style><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
</head><body><main class="cart-page"><a href="index.html">← Continue shopping</a><h1>Your Cart</h1><div id="items"></div><div id="total" class="cart-total"></div></main><script>const money=n=>n?'₹'+n:'Price coming soon';function render(){const c=JSON.parse(localStorage.getItem('dc-cart')||'[]'),el=document.getElementById('items');if(!c.length){el.innerHTML='<div class="empty">Your cart is empty.</div>';document.getElementById('total').textContent='';return}el.innerHTML=c.map((x,i)=>`<div class="cart-row"><img src="${x.image}"><div style="flex:1"><h3>${x.name}</h3><p>${money(x.price)}</p><label>Qty <input type="number" min="1" value="${x.qty}" onchange="update(${i},this.value)"></label></div><button onclick="removeItem(${i})">Remove</button></div>`).join('');document.getElementById('total').textContent='Total: '+money(c.reduce((s,x)=>s+(Number(x.price)||0)*x.qty,0));}function update(i,v){let c=JSON.parse(localStorage.getItem('dc-cart')||'[]');c[i].qty=Math.max(1,Number(v)||1);localStorage.setItem('dc-cart',JSON.stringify(c));render()}function removeItem(i){let c=JSON.parse(localStorage.getItem('dc-cart')||'[]');c.splice(i,1);localStorage.setItem('dc-cart',JSON.stringify(c));render()}render();</script></body></html>
