<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Bag — Decorative Corner</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.ico"></head><body><main class="cart-page"><a href="index.html">← Continue shopping</a><h1>Your shopping bag</h1><div id="items"></div><div id="total" class="cart-total"></div><p id="checkout-note"></p><a class="btn btn-primary" href="contact.html">Contact us to place your order</a></main><script>const KEY='dc-cart';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function put(c){localStorage.setItem(KEY,JSON.stringify(c));render()}function render(){const c=get(),el=document.getElementById('items');if(!c.length){el.innerHTML='<div class="empty">Your shopping bag is empty.</div>';document.getElementById('total').textContent='';return}el.innerHTML=c.map((x,i)=>`<div class="cart-row"><img src="${x.image}" alt="${x.name}"><div class="cart-details"><h3>${x.name}</h3><p>${money(x.price)}</p><div class="quantity-control"><label for="qty-${i}">Quantity</label><input id="qty-${i}" type="number" min="1" value="${x.qty}" data-qty="${i}"></div></div><button type="button" data-remove="${i}" aria-label="Remove ${x.name} from shopping bag">Remove item</button></div>`).join('');document.getElementById('total').textContent='Total: '+money(c.reduce((s,x)=>s+(Number(x.price)||0)*x.qty,0));document.querySelectorAll('[data-qty]').forEach(el=>el.addEventListener('change',()=>{const c=get();c[Number(el.dataset.qty)].qty=Math.max(1,Number(el.value)||1);put(c)}));document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{const c=get();c.splice(Number(el.dataset.remove),1);put(c)}))}render();</script></body></html>
