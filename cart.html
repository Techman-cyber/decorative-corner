<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Bag — Decorative Corner</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.ico"><style>
.cart-row{display:flex;align-items:flex-start;gap:22px;margin:18px 0;padding:22px;border:1px solid #e8dfd6;border-radius:16px;background:#fffdf9}
.cart-row img{width:112px;height:112px;flex:0 0 112px;object-fit:cover;border-radius:12px}
.cart-details{flex:1;min-width:0}
.cart-row h3{margin:0 0 8px;font-size:22px}
.cart-row p{margin:0 0 14px;font-size:18px}
.cart-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cart-qty{display:inline-flex;align-items:center;gap:14px}
.cart-qty button{width:42px;height:42px;border:1px solid #d8cfc5;background:#fff;border-radius:10px;font-size:24px;line-height:1;cursor:pointer}
.cart-qty button:hover{background:#f4eee7}
.cart-qty output{min-width:20px;text-align:center;font-size:18px;font-weight:700}
.cart-remove{height:42px;border:1px solid #c94b4b;background:#fff;color:#a51d1d;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer}
.cart-remove:hover{background:#fff0f0}
.cart-total{font-size:20px;font-weight:800;margin:24px 0}
@media(max-width:520px){.cart-row{gap:14px;padding:14px}.cart-row img{width:78px;height:78px;flex-basis:78px}.cart-row h3{font-size:18px}.cart-row p{font-size:16px}.cart-qty button,.cart-remove{height:38px}.cart-qty button{width:38px}}
</style></head><body><main class="cart-page"><a href="index.html">← Continue shopping</a><h1>Your shopping bag</h1><div id="items"></div><div id="total" class="cart-total"></div><p id="checkout-note"></p><a class="btn btn-primary" href="contact.html">Contact us to place your order</a></main><script>const KEY='dc-cart';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function put(c){localStorage.setItem(KEY,JSON.stringify(c));render()}function render(){const c=get(),el=document.getElementById('items');if(!c.length){el.innerHTML='<div class="empty">Your shopping bag is empty.</div>';document.getElementById('total').textContent='';return}el.innerHTML=c.map((x,i)=>`<div class="cart-row"><img src="${x.image}" alt="${x.name}"><div class="cart-details"><h3>${x.name}</h3><p>${money(125)}</p><div class="cart-actions"><div class="cart-qty" aria-label="Quantity for ${x.name}"><button type="button" data-minus="${i}" aria-label="Decrease quantity">−</button><output>${Math.max(1,Number(x.qty)||1)}</output><button type="button" data-plus="${i}" aria-label="Increase quantity">+</button></div><button type="button" class="cart-remove" data-remove="${i}">Remove</button></div></div></div>`).join('');document.getElementById('total').textContent='Total: '+money(c.reduce((s,x)=>s+125*(Math.max(1,Number(x.qty)||1)),0));document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.minus);c[i].qty=Math.max(1,(Number(c[i].qty)||1)-1);put(c)}));document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.plus);c[i].qty=(Number(c[i].qty)||1)+1;put(c)}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{const c=get(),i=Number(b.dataset.remove);c.splice(i,1);put(c)}))}render();</script></body></html>
