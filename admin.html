<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decorative Corner Admin</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css"><style>.admin-box{background:#fffaf0;border:1px solid #d9c9a8;border-radius:18px;padding:24px;margin:24px 0}.admin-box label{display:block;margin:12px 0 6px;font-weight:700}.admin-box input,.admin-box textarea{width:100%;padding:12px;border:1px solid #cbbd9f;border-radius:10px}.admin-box textarea{min-height:100px}.admin-product{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:16px;border:1px solid #ddd0b5;border-radius:14px;margin:12px 0;background:#fff}.admin-product img{width:90px;height:90px;object-fit:cover;border-radius:10px}.admin-actions{display:flex;gap:8px}.admin-actions button{padding:9px 12px}.success{color:green}.error{color:#b3261e}@media(max-width:650px){.admin-product{grid-template-columns:70px 1fr}.admin-actions{grid-column:1/-1}.admin-product img{width:70px;height:70px}}</style></head><body><main class="wrap" style="padding:32px 0"><a href="index.html">← Back to shop</a><h1>Admin Control Center</h1><p>Add, edit, and remove products below. Changes are saved to your Firebase <b>products</b> collection.</p><section class="admin-box"><h2>Product editor</h2><form id="product-form"><label for="name">Product name</label><input id="name" required><label for="price">Price</label><input id="price" required placeholder="$25"><label for="image">Image URL</label><input id="image" placeholder="https://..."><label for="description">Description</label><textarea id="description"></textarea><p id="status" aria-live="polite"></p><button id="save-btn" class="btn" type="submit">Add product</button> <button id="cancel-btn" class="btn btn-outline" type="button" hidden>Cancel edit</button></form></section><h2>Products</h2><section id="products-list">Loading products…</section></main><script type="module" src="admin.js"></script></body></html>
